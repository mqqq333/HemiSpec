<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 904" width="1280" height="904" role="img" aria-labelledby="fig-title fig-desc" lang="en">
<title id="fig-title">HemiSpec workflow: bilateral DGN reconstruction to ANS/RNS maps (illustrative schematic)</title>
<desc id="fig-desc">Method schematic, not data. Stage 1: external FSL preprocessing (BET, FAST, FLIRT, GM threshold and mask) converts T1-weighted MRI to an MNI152 1.5 mm gray-matter map, one subject per NIfTI file. HemiSpec DGN input begins at this preprocessed map, not raw T1. Stage 2: two direction-specific DGN models reconstruct contralateral target hemispheres. Lane A, L_to_R, uses LEFT as source and reconstructs RIGHT; lane B, R_to_L, uses RIGHT as source and reconstructs LEFT. Stage 3: compare each reconstructed target with the actual target voxel-wise. ANS is the absolute residual. Public RNS is the absolute residual divided by the target sum; the numerical implementation uses an absolute-value denominator plus epsilon, not an exactly equivalent expression. Defaults: finite values, actual GM at least 0.15, epsilon 1e-6. Stage 4: L_to_R yields ANS.R and RNS.R; R_to_L yields ANS.L and RNS.L. Optional: atlas-based ROI tables, test–retest reliability across repeated sessions, and hemisphere-classifier validation requiring compatible ROI features and classifier assets. Python package, CLI, GUI and compiled Windows app are interfaces with differing feature coverage. Abstract hemisphere glyphs and hatched map tiles are illustrative, not anatomy or data. DGN and ANS/RNS: Wang et al. (2024), Patterns 5:100930. HemiSpec provides software, packaging and downstream workflow.</desc>
