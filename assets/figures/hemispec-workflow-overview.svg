<g id="footnotes">
<path d="M48,824 H1232" class="conn" stroke="#D6CDB9" stroke-width="1"/>
<text x="48" y="844" class="cap" >† D = |Act| + |Recon| + 1e-6 (code). Public RNS: |(Act − Recon)/(Act + Recon)|; for nonnegative values, code approaches public form as ε → 0.</text>
<text x="48" y="862" class="cap" >Act = actual target GM; Recon = its reconstruction from the opposite hemisphere. L is shown on the left; abstract glyphs are not anatomy.</text>
<text x="48" y="880" class="cap" >DGN / ANS / RNS: Wang et al. (2024), Patterns 5:100930. HemiSpec: software, packaging and downstream workflow. Illustrative schematic — not data.</text>
</g>
